[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtgsets"
version = "0.1.0"
description = "Manage a Magic: The Gathering collection by full set and export to Moxfield."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mike-theDude" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Development / test tooling. Install with `pip install -e .[dev]`.
# HTTP mocking uses stdlib httpx.MockTransport, so no extra dependency is needed.
dev = [
    "pytest>=8.0",
]

[project.scripts]
mtgsets = "mtgsets.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mtgsets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
