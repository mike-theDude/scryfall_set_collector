[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtgsets"
version = "0.1.0"
description = "Manage a Magic: The Gathering collection by full set and export to Moxfield."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mike-theDude" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Development / test tooling. Install with `pip install -e .[dev]`.
# HTTP mocking uses stdlib httpx.MockTransport, so no extra dependency is needed.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mtgsets = "mtgsets.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mtgsets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, import sorting, pyupgrade, bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument as parameter defaults is the standard Typer idiom, not
# the mutable-default bug B008 guards against.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.coverage.run]
source = ["mtgsets"]

[tool.coverage.report]
show_missing = true
